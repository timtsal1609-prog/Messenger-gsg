name: Build web APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          Z=$(find . -iname 'Messenger-web*.zip' | head -1)
          mkdir -p www && unzip -q -o "$Z" -d www
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Make app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Messenger com.example.messenger --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: act
